name: Update EPG
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/update-epg.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: epg-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and validate EPG
        run: |
          set -euo pipefail
          trap 'rm -f pp.xml.tmp' EXIT
          curl --fail --location --retry 3 --retry-delay 10 --connect-timeout 20 --max-time 180 --proto '=https' --proto-redir '=https' https://epg.112114.xyz/pp.xml -o pp.xml.tmp
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = 'pp.xml.tmp'
          size = os.path.getsize(path)
          if not 1024 <= size <= 100 * 1024 * 1024:
              raise SystemExit('Unexpected EPG size')
          root = ET.parse(path).getroot()
          if root.tag != 'tv' or root.find('channel') is None or root.find('programme') is None:
              raise SystemExit('Not a populated XMLTV document')
          print('Validated XMLTV:', size, 'bytes')
          PY
          mv pp.xml.tmp pp.xml
      - name: Commit EPG if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pp.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Update EPG'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request existing Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
